networks:
  rag-misw:
    driver: bridge

services:
  # Backend principal (RAG) - Puerto 8001
  backend:
    build:
      context: ./MISW4411-Backend
    image: misw4411-backend-img
    container_name: misw4411-backend
    ports:
      - "8001:8001"
    networks:
      - rag-misw
    restart: unless-stopped
    environment:
      - GIT_PYTHON_REFRESH=quiet
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - HF_HOME=/app/.cache/huggingface
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
    volumes:
      # Documentos descargados - persistir fuera del contenedor
      - ./MISW4411-Backend/docs:/app/docs
      # Logs de procesamiento - persistir fuera del contenedor
      - ./MISW4411-Backend/logs:/app/logs
      # Base de datos vectorial ChromaDB - persistir fuera del contenedor
      - ./MISW4411-Backend/chroma_db:/app/chroma_db
      # Cache de modelos de HuggingFace - persistir fuera del contenedor
      - ./MISW4411-Backend/.cache:/app/.cache

  # Agent Backend - Puerto 8000
  agent-backend:
    build:
      context: ./202515-MISW4411-Agent-Backend-Grupo02
    image: misw4411-agent-backend-img
    container_name: misw4411-agent-backend
    ports:
      - "8000:8000"
    networks:
      - rag-misw
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - RAG_BASE_URL=http://backend:8001
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}

  # Frontend - Puerto 3000
  frontend:
    build:
      context: ./202515-MISW4411-Agent-Frontend-Template
      args:
        # Para desarrollo local, usar localhost. Para producción en GCP, usar la IP externa o dominio
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8000}
    image: misw4411-frontend-img
    container_name: misw4411-frontend
    ports:
      - "3000:3000"
    networks:
      - rag-misw
    depends_on:
      - agent-backend
    restart: unless-stopped
